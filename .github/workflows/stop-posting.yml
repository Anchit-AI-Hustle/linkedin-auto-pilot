name: Stop posting

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: linkedin-post

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pause the series
        run: |
          echo "Remove this file (or run the 'Start posting' workflow) to resume the series." > PAUSE
          git config user.name "linkedin-auto-pilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAUSE
          git diff --cached --quiet || (git commit -m "Stop posting" && git push)
