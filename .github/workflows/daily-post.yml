name: LinkedIn post every 6 hours

# Posts the next approved post at 2 AM, 8 AM, 2 PM and 8 PM IST
# (20:30, 02:30, 08:30 and 14:30 UTC). Can also be run by hand.
on:
  schedule:
    - cron: "30 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, post nothing)"
        default: "true"

permissions:
  contents: write

concurrency: linkedin-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -W ignore test_post.py
      - name: Publish today's post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python post.py
      - name: Record what was posted
        run: |
          git config user.name "linkedin-auto-pilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F)" && git push)
