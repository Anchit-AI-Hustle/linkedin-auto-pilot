name: LinkedIn post every 6 hours

# Posts the next approved post in each slot: 2 AM, 8 AM, 2 PM and 8 PM IST.
# GitHub often drops or delays scheduled runs, so this asks for a run three times an hour
# (away from the busy top of the hour). post.py posts at most once per slot, so any one
# run that fires inside a slot is enough. Running it by hand posts the next post now.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, post nothing)"
        default: "true"
      scheduled:
        description: "Sent by the external scheduler (posts only in its slot, never forces)"
        default: "false"

permissions:
  contents: write
  issues: write

concurrency: linkedin-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -W ignore test_post.py
      - name: Publish today's post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled != 'true' && inputs.dry_run || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled != 'true' }}
        run: python post.py
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "linkedin-auto-pilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the run log only when something happened (a post, a comment, a problem), so quiet hourly runs don't add commits.
          if git diff --quiet -- posted.json && ! grep -qiE "not added|error|failed|did not upload|Published" last-run.log 2>/dev/null; then
            exit 0
          fi
          git add posted.json last-run.log
          git diff --cached --quiet && exit 0
          git commit -m "Posted $(date -u +%F)"
          # Other workflows also push (series page refresh). Rebase and retry so the
          # record always lands; a lost record would let the next hourly run repost.
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && exit 0
            sleep $((i * 10))
          done
          echo "::error::Could not save posted.json; pausing the series to prevent a double post."
          echo "Paused after a failed save. Check posted.json, then run Start posting." > PAUSE
          git add PAUSE posted.json && git commit -qm "Pause: posted.json save failed" || true
          git pull --rebase -q origin main && git push || true
          exit 1
      - name: Alert on failure
        # Opens an issue so a failed slot never goes unnoticed.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Posting run failed"
          body=$(printf 'Run: %s\n\nLast lines of last-run.log:\n\n```\n%s\n```\n' "$RUN_URL" "$(tail -n 25 last-run.log 2>/dev/null || echo 'no log')")
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number' 2>/dev/null || true)
          # One alert per outage: while that issue is open, later failed runs stay quiet. Close it once fixed.
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body" || true
          fi
