name: WhatsApp review tick

on:
  schedule:
    - cron: "30 18-23,0-3 * * *"   # hourly from 00:00 to 09:00 IST only (10 runs a day)
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick the review service
        env:
          TICK_URL: ${{ secrets.REVIEW_TICK_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "::notice::WhatsApp review is not set up (REVIEW_TICK_URL or TICK_SECRET is missing), so there is nothing to tick."
            exit 0
          fi
          curl -fsS -X POST "$TICK_URL" -H "Authorization: Bearer $TICK_SECRET"
